apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis
  namespace: {{ .Values.namespace }}

spec:
  serviceName: redis
  replicas: {{ .Values.redis.replicas }}

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis

          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"

          ports:
            - containerPort: {{ .Values.redis.port }}

          command:
            - redis-server

          args:
            - "--appendonly"
            - "yes"

          volumeMounts:
            - name: redis-storage
              mountPath: /data

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}

      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc